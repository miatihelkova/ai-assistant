<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #f6f6f6;
      color: #111;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    textarea {
      width: 100%;
      min-height: 90px;
      border-radius: 14px;
      border: 1px solid #ddd;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 10px;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      background: #111;
      color: white;
    }

    .response {
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .small {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>AI asistent</h1>
    <p class="small">Napiš přirozeně, co se stalo nebo co potřebuješ.</p>

    <div class="card">
      <textarea id="message" placeholder="Např. vypila jsem litr vody a koupit granule pro kočky"></textarea>
      <button onclick="sendMessage()">Odeslat</button>
    </div>

    <div class="card">
      <strong>Odpověď asistenta</strong>
      <div id="response" class="response small">Zatím nic.</div>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const message = document.getElementById("message").value;
      const responseBox = document.getElementById("response");

      if (!message.trim()) {
        responseBox.textContent = "Napiš zprávu.";
        return;
      }

      responseBox.textContent = "Přemýšlím...";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        responseBox.textContent =
          (data.response || "Hotovo.") +
          "\n\nAkce:\n" +
          JSON.stringify(data.actions || [], null, 2) +
          "\n\nUloženo:\n" +
          JSON.stringify(data.savedActions || [], null, 2);
      } catch (error) {
        responseBox.textContent = "Chyba: " + error.message;
      }
    }
  </script>
</body>
</html>
