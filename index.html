<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI Assistant</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #f6f6f6;
      color: #111;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      box-sizing: border-box;
    }

    header {
      padding: 10px 0 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .small {
      color: #666;
      font-size: 14px;
    }

    .version {
      margin-top: 4px;
      color: #999;
      font-size: 12px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 16px;
    }

    .message {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #111;
      color: white;
      border-bottom-right-radius: 6px;
    }

    .assistant {
      align-self: flex-start;
      background: white;
      color: #111;
      border-bottom-left-radius: 6px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .meta {
      margin-top: 8px;
      font-size: 12px;
      color: #777;
    }

    .confirm-button {
      margin-top: 10px;
      width: auto;
      padding: 10px 14px;
      border-radius: 12px;
      background: #111;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .confirm-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .input-area {
      background: white;
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 -2px 18px rgba(0,0,0,0.06);
      position: sticky;
      bottom: 0;
    }

    textarea {
      width: 100%;
      min-height: 70px;
      border-radius: 14px;
      border: 1px solid #ddd;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      resize: none;
    }

    button {
      width: 100%;
      margin-top: 10px;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 12px 0;
    }

    .quick-actions button {
      width: auto;
      white-space: nowrap;
      margin: 0;
      padding: 10px 12px;
      font-size: 14px;
      background: white;
      color: #111;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <h1>AI asistent</h1>

      <div class="small">
        Napiš přirozeně, co se stalo nebo co potřebuješ.
      </div>

      <div class="version">
        index v3.1 – frontend sjednocený v index.html
      </div>
    </header>

    <div class="quick-actions">
      <button onclick="quickSend('vypila jsem 250 ml vody')">
        +250 ml vody
      </button>

      <button onclick="quickSend('přidat úkol ')">
        + úkol
      </button>

      <button onclick="quickSend('koupit ')">
        + nákup
      </button>

      <button onclick="quickSend('jak si dnes vedu?')">
        dnešní stav
      </button>
    </div>

    <main id="chat" class="chat">
      <div class="message assistant">
        Ahoj, jsem připravená.
        Napiš mi třeba:
        „vypila jsem litr vody a koupit granule pro kočky“.
      </div>
    </main>

    <div class="input-area">
      <textarea
        id="message"
        placeholder="Napiš zprávu..."
      ></textarea>

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        Odeslat
      </button>
    </div>

  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("sendButton");

    let isSending = false;

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function addMessage(role, text, meta = "") {
      const bubble = document.createElement("div");

      bubble.className = `message ${role}`;
      bubble.textContent = text;

      if (meta) {
        const metaDiv = document.createElement("div");

        metaDiv.className = "meta";
        metaDiv.textContent = meta;

        bubble.appendChild(metaDiv);
      }

      chat.appendChild(bubble);

      scrollToBottom();

      return bubble;
    }

    function buildMeta(savedActions = []) {
      if (!Array.isArray(savedActions)) {
        return "";
      }

      const counts = {
        saved: 0,
        pending: 0,
        duplicate: 0,
        skipped: 0,
        errors: 0
      };

      savedActions.forEach(action => {
        if (action.error || action.validation_error) {
          counts.errors++;
          return;
        }

        if (action.duplicate === true) {
          counts.duplicate++;
          return;
        }

        if (action.pending === true && action.confirmation_token) {
          counts.pending++;
          return;
        }

        if (action.skipped === true) {
          counts.skipped++;
          return;
        }

        if (action.saved === true) {
          counts.saved++;
        }
      });

      const meta = [];

      if (counts.saved > 0) {
        meta.push(`Uloženo: ${counts.saved}`);
      }

      if (counts.pending > 0) {
        meta.push(`Čeká na potvrzení: ${counts.pending}`);
      }

      if (counts.duplicate > 0) {
        meta.push(`Už existuje: ${counts.duplicate}`);
      }

      if (counts.skipped > 0) {
        meta.push(`Přeskočeno: ${counts.skipped}`);
      }

      if (counts.errors > 0) {
        meta.push(`Chyba u akcí: ${counts.errors}`);
      }

      return meta.join(" • ");
    }

    async function safeJson(response) {
      try {
        return await response.json();
      } catch {
        return null;
      }
    }

    function createLoadingBubble() {
      const bubble = document.createElement("div");

      bubble.className = "message assistant";
      bubble.textContent = "Přemýšlím...";

      chat.appendChild(bubble);

      scrollToBottom();

      return bubble;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message || isSending) {
        return;
      }

      isSending = true;

      addMessage("user", message);

      input.value = "";
      sendButton.disabled = true;

      const loadingBubble = createLoadingBubble();

      try {
        const controller = new AbortController();

        const timeout = setTimeout(() => {
          controller.abort();
        }, 30000);

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message }),
          signal: controller.signal
        });

        clearTimeout(timeout);

        const data = await safeJson(response);

        loadingBubble.remove();

        if (!response.ok) {
          addMessage(
            "assistant",
            data?.error || "Server vrátil chybu."
          );

          return;
        }

        if (!data || typeof data !== "object") {
          addMessage(
            "assistant",
            "Server vrátil neplatnou odpověď."
          );

          return;
        }

        if (data.success === false) {
          addMessage(
            "assistant",
            data.error || "Zpracování se nepovedlo."
          );

          return;
        }

        const savedActions = Array.isArray(data.savedActions)
          ? data.savedActions
          : [];

        const meta = buildMeta(savedActions);

        const assistantBubble = addMessage(
          "assistant",
          data.response || "Hotovo.",
          meta
        );

        const pendingActions = savedActions.filter(action => {
          return (
            action.pending === true &&
            action.confirmation_token
          );
        });

        pendingActions.forEach(action => {
          const button = document.createElement("button");

          button.className = "confirm-button";
          button.textContent = "Potvrdit akci";

          button.onclick = async () => {
            button.disabled = true;
            button.textContent = "Potvrzuji...";

            try {
              const response = await fetch("/api/confirm", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  confirmation_token: action.confirmation_token
                })
              });

              const data = await safeJson(response);

              if (!response.ok || data?.success === false) {
                button.textContent = "Chyba";

                addMessage(
                  "assistant",
                  data?.error ||
                  data?.message ||
                  "Potvrzení se nepovedlo."
                );

                return;
              }

              button.textContent = "Potvrzeno";

              addMessage(
                "assistant",
                data?.message || "Akce potvrzena."
              );

            } catch (error) {
              button.textContent = "Chyba";

              addMessage(
                "assistant",
                "Potvrzení se nepovedlo: " + error.message
              );
            }
          };

          assistantBubble.appendChild(button);
        });

      } catch (error) {
        loadingBubble.remove();

        if (error.name === "AbortError") {
          addMessage(
            "assistant",
            "Server neodpověděl včas."
          );
        } else {
          addMessage(
            "assistant",
            "Chyba: " + error.message
          );
        }

      } finally {
        isSending = false;
        sendButton.disabled = false;
        input.focus();
      }
    }

    function quickSend(text) {
      input.value = text;
      input.focus();
    }

    input.addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
